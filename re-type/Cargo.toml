[package]
name = "re-type"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Types the clipboard text into the foreground window as keystrokes"
publish = false
license = "GPL-3.0-or-later"
authors = ["Michele Brami"]
repository = "https://github.com/mbrami76/re-type"
homepage = "https://michelebrami.it"

[[bin]]
name = "re-type"
path = "src/bin/re-type.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_UI_Accessibility",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Panics must unwind so the typing buffer is cleared on every exit path.
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
