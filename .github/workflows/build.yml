#
# Tests the program and builds re-type.exe on every push and pull request. When a tag such as v1.0.0
# is pushed, the executable and its SHA-256 checksum are attached to a GitHub release.
# The build uses the same tool chain every time (pinned versions below), so a build can be repeated.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.0"
  ZIGLANG_VERSION: "0.17.1"
  CARGO_ZIGBUILD_VERSION: "0.24.1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: re-type
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust tool chain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-pc-windows-gnu
          rustup default "$RUST_VERSION"

      - name: Install Zig and cargo-zigbuild
        run: |
          python3 -m pip install --user "ziglang==$ZIGLANG_VERSION"
          cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked

      - name: Test
        run: cargo test --locked

      - name: Build the Windows executable
        run: cargo zigbuild --release --locked --target x86_64-pc-windows-gnu

      - name: Name the files and compute the checksum
        id: pack
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p ../dist
          cp target/x86_64-pc-windows-gnu/release/re-type.exe "../dist/re-type-${version}.exe"
          (cd ../dist && sha256sum "re-type-${version}.exe" > "re-type-${version}.exe.sha256")
          cat "../dist/re-type-${version}.exe.sha256"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Signing goes here once the project has a code signing certificate:
      # the signing service takes the unsigned executable from this job's artifact and returns the
      # signed file, and the checksum is computed on the signed file.

      - uses: actions/upload-artifact@v7
        with:
          name: re-type-${{ steps.pack.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version of the program
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' re-type/Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in re-type/Cargo.toml" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: re-type-${{ env.VERSION }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Re:Type ${VERSION}" \
            --notes "Windows 10 and 11 (64-bit). Check the download with the .sha256 file: sha256sum -c re-type-${VERSION}.exe.sha256 (or Get-FileHash in PowerShell). The executable is not code-signed yet, so Windows may show an unknown publisher warning."
